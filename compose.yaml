# Skype 側を模した fake-skype と Bot を起動するデモ環境です。外部のサービスには接続しません。
name: simple-skype-bot

services:
  fake-skype:
    build:
      context: .
      target: fake-skype
    image: simple-skype-bot:fake-skype
    environment:
      FAKE_SKYPE_TOKEN: dummy-token
    volumes:
      - fake-skype-data:/skype

  bot:
    build:
      context: .
      target: runtime
    image: simple-skype-bot:runtime
    environment:
      SKYPE_DB_DIR: /skype
      SKYPE_URL: http://fake-skype:8080/v1/users/ME/conversations/demo/messages
      SKYPE_TOKEN: dummy-token
      # fake-skype はコンテナ間の通信のみのため、http:// を許可します。
      SKYPE_ALLOW_HTTP: "1"
    volumes:
      - fake-skype-data:/skype:ro
    depends_on:
      fake-skype:
        condition: service_healthy

  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    image: simple-skype-bot:dev

volumes:
  fake-skype-data:
