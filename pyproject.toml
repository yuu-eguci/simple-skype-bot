# ツールの設定のみを記述しています。依存パッケージは requirements*.txt で管理しています。
[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.format]
# 既存のコードに合わせてシングルクォートを使用します。
quote-style = "single"
